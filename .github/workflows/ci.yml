name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so bin/po-version-check finds origin/<Target branch> to compare po/ with.
          fetch-depth: 0
      - run: command -v jq >/dev/null || if [ "$(id -u)" = 0 ]; then apt-get update && apt-get install -y jq; else sudo apt-get update && sudo apt-get install -y jq; fi
      - run: bin/po-ci
